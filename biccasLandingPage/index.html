<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biccas - Work Together</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Biccas</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Product</a>
            <a href="#">FAQ</a>
            <a href="#">Blog</a>
            <a href="#">About Us</a>
            <a href="#">Login</a>
            <a class="signup" href="#">Sign Up</a>
        </nav>
    </header>
    <main class="hero">
        <div class="hero-content">
            <h2>We're here to increase your productivity</h2>

            <div class="hero-underline"></div>

            <p class="hero-description">
                Let's make your work more organize and easily using the Taskio Dashboard with many of the latest features in managing work every day.
            </p>

            <div class="hero-actions">
                <a class="trial-button" href="#">Try free trial</a>


                <a class="demo-link" href="#">
                    <span class="play-icon">▶</span>
                    <span>View Demo</span>
                </a>
            </div>
        </div>

        <div class="hero-visual">
            <img src="hreoSectionImage.png" alt="Biccas landing page illustration">

            <div class="amount-card">
                <span class="amount-label">Enter amount</span>

                <div class="amount-row">
                    <strong>$450.00</strong>
                    <button type="button">Send</button>
                </div>
            </div>
            
            <div class="total-card">
                <span>Total Income</span>
                <strong>$245.00</strong>
            </div>
        </div>
    </main>
</body>
</html>
